<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0.111cm 챌린지</title>
<meta name="description" content="초코 스틱이 줄어들 때 딱 0.111cm에서 멈추는 타이밍 게임. 팀 순위로 겨뤄요.">
<meta property="og:title" content="0.111cm 챌린지">
<meta property="og:description" content="0.111cm에 가장 가깝게 멈춘 사람이 이겨요.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D2329" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='13' y='3' width='6' height='19' rx='1' fill='%235A3726'/%3E%3Crect x='13' y='21' width='6' height='8' rx='2' fill='%23D8A85E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <section class="game" aria-label="게임">
    <div class="stage" id="stage" role="button" tabindex="0" aria-label="탭해서 시작하거나 멈추기">
      <canvas id="cv"></canvas>
      <div class="hud" id="hud">
        <div class="len" id="lenWrap"><span id="len">15.000</span><span class="unit">cm</span></div>
        <p class="goal">0.111cm에서 멈추세요</p>
        <p class="status" id="status">탭하면 시작해요</p>
        <div class="challenge" id="challenge" hidden>
          <span><b id="chName"></b>님 기록 <b class="mono" id="chLen"></b>에 도전 중</span>
          <button type="button" class="link-btn" id="chClose" aria-label="도전 닫기">닫기</button>
        </div>
        <div class="result" id="result" hidden>
          <p class="rdiff" id="rDiff"></p>
          <p class="rnote" id="rNote" hidden></p>
          <p class="rchal" id="rChal" hidden></p>
          <div class="ractions">
            <button type="button" class="primary" id="again">다시 하기</button>
            <button type="button" class="ghost" id="shareCard">결과 카드</button>
            <button type="button" class="ghost" id="shareLink">도전장</button>
          </div>
        </div>
      </div>
      <div class="flash" id="flash" hidden></div>
    </div>
  </section>

  <aside class="board" aria-label="순위">
    <div class="bh">
      <h2>팀 순위</h2>
      <button class="who" id="whoBtn" type="button" aria-label="닉네임 정하기">
        <span class="who-name" id="whoName">닉네임 정하기</span><span class="who-edit" id="whoEdit" hidden>변경</span>
      </button>
    </div>
    <p class="sub" id="boardSub">1인 최고 기록 · 0.111cm에 가까운 순</p>
    <div class="mine">
      <div><span class="k">내 최고</span><span class="v" id="mBest">—</span></div>
      <div><span class="k">오차</span><span class="v" id="mErr">—</span></div>
      <div><span class="k">플레이</span><span class="v" id="mTries">0판</span></div>
    </div>
    <ol class="ranks" id="ranks"><li class="empty">순위를 불러오는 중이에요…</li></ol>
    <p class="note" id="note" hidden></p>

    <h3>최근 플레이</h3>
    <ul class="recent" id="recent"></ul>

    <p class="rule"><b>변칙 스틱</b> 열 판 중 네 판은 급가속, 멈칫, 출렁 중 하나가 섞여 나와요.</p>
  </aside>
</div>

<dialog class="dlg" id="nickDlg" aria-labelledby="nickTitle">
  <form id="nickForm" novalidate>
    <h2 id="nickTitle">닉네임을 정해 주세요</h2>
    <p class="dlg-sub">순위표에 이 이름으로 올라가요. 이 브라우저에 저장돼서 다음에 들어와도 그대로예요.</p>
    <label class="field" for="nickInput">닉네임</label>
    <input id="nickInput" name="nick" type="text" maxlength="12" autocomplete="nickname" spellcheck="false" placeholder="예: 민세" required>
    <p class="field-hint">한글·영문·숫자·_·- 2~12자</p>
    <p class="err" id="nickErr" role="alert" hidden></p>
    <div class="dlg-actions">
      <button type="button" class="ghost" id="nickLater">나중에</button>
      <button type="submit" class="primary" id="nickSave">시작하기</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<canvas id="cardCanvas" hidden></canvas>
<script type="module" src="js/main.js"></script>
</body>
</html>
